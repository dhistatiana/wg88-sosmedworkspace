       <div style="margin-top:14px"><div class="t-sub">Keterangan</div><p>${esc(l.detail)||'—'}</p></div>`,
      `<button class="btn btn-ghost" data-action="close-modal">Tutup</button>
       ${linked?`<button class="btn btn-primary" data-action="${l.ref.mod==='brief'?'brief-view':'report-view'}" data-id="${linked.id}">${ic('file')}${l.ref.mod==='brief'?'Lihat prompt':'Lihat isi laporan'}</button>`:''}`);
  }

  if(a==='brief-add'){
    syncBrief();
    const kind = t.dataset.kind;
    if(kind==='hero'){
      if(draftHeroes.length>=8){ toast('Maksimal 8 hero element.', true); return; }
      draftHeroes.push('');
    } else {
      if(draftSlides.length>=12){ toast('Maksimal 12 slide.', true); return; }
      draftSlides.push('');
    }
    renderBriefLists();
  }
  if(a==='brief-del'){
    syncBrief();
    const arr = t.dataset.kind==='hero' ? draftHeroes : draftSlides;
    if(arr.length>1) arr.splice(+t.dataset.i,1);
    renderBriefLists();
  }
  if(a==='brief-generate'){
    syncBrief();
    if(!briefDraft.product){ toast('Isi Main Product dulu.', true); return; }
    lastPrompt = buildPrompt();
    const label = `${briefDraft.event||'Event'} · ${briefDraft.product} · ${briefDraft.collection||'Collection'}`;
    const rec = {id:uid('BRF'), label, ts:new Date().toISOString().slice(0,16), prompt:lastPrompt,
      event:briefDraft.event, collection:briefDraft.collection, product:briefDraft.product};
    S.briefs.push(rec);
    logEvent({text:`Content brief "${label}" digenerate`, module:'Content Brief', status:'Final Approved', icon:'spark',
      ref:{mod:'brief', id:rec.id},
      detail:`${draftHeroes.filter(h=>h.trim()).length} hero element · ${draftSlides.length} slide${briefDraft.notes?' · ada catatan tambahan':''}`});
    TAB.brief = 'output';
    await commitRec('brief', rec, 'Prompt siap disalin.');
    const out = document.getElementById('briefOut');
    if(out) out.scrollIntoView({behavior:'smooth', block:'start'});
  }
  if(a==='brief-copy'){
    if(!lastPrompt){ toast('Generate prompt dulu.', true); return; }
    navigator.clipboard?.writeText(lastPrompt).then(()=>toast('Prompt disalin.'),()=>toast('Salin manual dari kotak prompt.',true));
  }
  if(a==='brief-reset'){
    openModal('Reset form brief?',
      `<p>Seluruh isian Product Information, Hero Elements, Slide Plan, dan Notes akan dikosongkan. Prompt yang sudah tersimpan di Activity History tidak terhapus.</p>`,
      `<button class="btn btn-ghost" data-action="close-modal">Batal</button>
       <button class="btn btn-primary" data-action="brief-reset-yes">Kosongkan form</button>`);
  }
  if(a==='brief-reset-yes'){
    briefDraft = {event:'', collection:'', product:'', notes:''};
    draftHeroes = ['','','']; draftSlides = ['','','','','','','',''];
    lastPrompt = '';
    closeModal(); render(); toast('Form dikosongkan.');
  }
  if(a==='brief-view'){
    const b = S.briefs.find(x=>x.id===t.dataset.id);
    if(!b) return;
    openModal(esc(b.label),
      `<div class="t-sub mono" style="margin-bottom:12px">${b.id} · ${fmtTs(b.ts)}</div>
       <div class="report">${esc(b.prompt)}</div>`,
      `<button class="btn btn-ghost" data-action="close-modal">Tutup</button>
       <button class="btn btn-primary" data-action="brief-copy-one" data-id="${b.id}">${ic('file')}Salin prompt</button>`);
  }
  if(a==='brief-copy-one'){
    const b = S.briefs.find(x=>x.id===t.dataset.id);
    if(b) navigator.clipboard?.writeText(b.prompt).then(()=>toast('Prompt disalin.'),()=>toast('Salin manual dari kotak prompt.',true));
  }

  if(a==='cal-move'){
    const [y,m] = calMonth.split('-').map(Number);
    const d = new Date(y, m-1 + (+t.dataset.dir), 1);
    calMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    render();
  }
  if(a==='cal-today'){ calMonth = today().slice(0,7); render(); }
  if(a==='cal-day'){ dayModal(t.dataset.date); }
  if(a==='agenda-add'){
    const title = val('agTitle');
    if(!title){ toast('Isi judul agenda dulu.', true); return; }
    const date = t.dataset.date, time = val('agTime');
    S.events.push({id:uid('AGD'), title, date, time});
    logEvent({text:`Agenda "${title}" ditambahkan`, module:'Agenda', status:'In Progress', icon:'cal',
      detail:`${fmt(date)}${time?' pukul '+time:' (sepanjang hari)'}`});
    closeModal();
    await commitRec('event', S.events[S.events.length-1], 'Agenda tersimpan di kalender.');
  }
  if(a==='agenda-gcal'){
    const title = val('agTitle') || 'Agenda Wondergift';
    window.open(gcalUrl(title, t.dataset.date, val('agTime')), '_blank');
  }
  if(a==='gcal'){
    window.open(gcalUrl(t.dataset.title, t.dataset.date, ''), '_blank');
  }

  if(a==='hreset'){ hF = {from:'', to:'', scope:'', status:'', by:'', q:''}; render(); }
  if(a==='copy-report'){
    const txt = document.querySelector('.report').textContent;
    navigator.clipboard?.writeText(txt).then(()=>toast('Laporan disalin.'),()=>toast('Salin manual dari kotak laporan.',true));
  }
});

let hTimer = null;
document.addEventListener('change', async (e)=>{
  const el = e.target;
  if(el.matches('[data-action="chk"]')){
    syncPoints();
    S.checklist[el.dataset.group][el.dataset.key] = el.checked;
    await saveSetting('checklist', S.checklist); render();
  }
  if(el.matches('.check input')) el.closest('.check').classList.toggle('on', el.checked);
  if(el.id === 'stStart' && el.value){ storyStart = el.value; refreshStoryDates(); }
  if(el.matches('select[data-brief]')){
    briefDraft[el.dataset.brief] = el.value;
    if(el.dataset.brief==='collection'){
      const h = document.getElementById('colHint');
      if(h) h.textContent = COL_HINTS[el.value] || '';
    }
  }
  if(el.matches('select[data-action="hfilter"]') || el.matches('input[type="date"][data-action="hfilter"]')){
    hF[el.dataset.key] = el.value; render();
  }
});
document.addEventListener('input', (e)=>{
  const el = e.target;
  if(el.matches('[data-brief]') && el.tagName !== 'SELECT'){ briefDraft[el.dataset.brief] = el.value; }
  if(el.matches('input[data-action="hfilter"][data-key="q"]')){
    clearTimeout(hTimer);
    hTimer = setTimeout(()=>{
      hF.q = el.value;
      render();
      const f = document.querySelector('input[data-key="q"]');
      if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }, 320);
  }
});

function collection(mod){ return {story:S.stories, campaign:S.campaigns, booster:S.boosters, ads:S.ads, report:S.reports, brief:S.briefs, task:S.tasks}[mod]; }
function findRec(mod, id){ return collection(mod).find(x=>x.id===id); }

function buildReport(type, rec){
  const d = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const I = buildInsight();
  const L = [];
  L.push(`WONDERGIFT · ${String(type||'Report').toUpperCase()}`);
  L.push(d);
  L.push('─'.repeat(46));
  L.push('');
  L.push('SUMMARY');
  I.summary.forEach(([lab,num])=>L.push(`   ${lab.padEnd(26,'.')} ${num}`));
  L.push('');
  L.push('OPERATIONAL INSIGHT');
  I.ops.forEach(o=>L.push(`   ${o.tone==='ok'?'✓':(o.tone==='warn'?'!':'·')} ${o.text}`));
  L.push('');
  L.push('MONITORING CHECKLIST');
  Object.keys(CHECKLIST_DEF).forEach(g=>{
    const [done,total] = checklistScore(g);
    L.push(`   ${CHECKLIST_DEF[g].label}: ${done}/${total} terpenuhi`);
    CHECKLIST_DEF[g].items.filter(([k])=>!S.checklist[g][k]).forEach(([,lab])=>L.push(`      ☐ ${lab}`));
  });
  if(rec && rec.points && rec.points.length){
    L.push('');
    L.push('ADDITIONAL REPORTING POINTS');
    rec.points.forEach((p,i)=>{
      L.push(`   ${i+1}. [${p.cat}] ${p.title||'—'}`);
      if(p.body) p.body.split('\n').forEach(b=>L.push(`      ${b}`));
    });
  }
  L.push('');
  L.push('RECOMMENDATION');
  I.recs.forEach((r,i)=>L.push(`   ${i+1}. ${r}`));
  if(rec && rec.notes){ L.push(''); L.push('CATATAN PENYUSUN'); L.push('   '+rec.notes); }
  L.push('');
  L.push('─'.repeat(46));
  L.push('Disusun otomatis dari data workspace · Wondergift');
  return L.join('\n');
}

/* ---------- sidebar mobile ---------- */
document.getElementById('burger').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('on');
});
document.getElementById('backdrop').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('on');
});
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(route==='dashboard' && TAB.dashboard==='sop' && !document.getElementById('overlay').classList.contains('on')){
    if(e.key==='ArrowRight' && sopIdx < SOP_SLIDES.length-1){ sopIdx++; render(); }
    if(e.key==='ArrowLeft'  && sopIdx > 0){ sopIdx--; render(); }

});
document.getElementById('bell').addEventListener('click', ()=>{
  const n = buildNotifs();
  openModal('Notification',
    n.length ? n.map(x=>`<div class="notif" style="margin-bottom:9px"><div class="notif-ico" style="background:${x.bg};color:${x.col}">${ic(x.icon)}</div><div><p>${x.text}</p><small>${x.meta}</small></div></div>`).join('')
             : `<div class="empty"><strong>Semua bersih</strong>Tidak ada yang menunggu tindakan.</div>`);

/* ---------- realtime: perubahan dari device lain masuk sendiri ---------- */
let syncTimer = null;
function listenRealtime(){
  db.channel('workspace')
    .on('postgres_changes', {event:'*', schema:'public', table:'records'},  queueSync)
    .on('postgres_changes', {event:'*', schema:'public', table:'settings'}, queueSync)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'activity_log'}, queueSync)
    .subscribe();
}
function queueSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    // jangan tarik ulang saat pengguna sedang mengetik di sebuah form
    const ae = document.activeElement;
    if(ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return queueSync();
    try{ S = await fetchAll(); render(); }catch(e){ console.error(e); }
  }, 700);
}

/* ---------- layar login ---------- */
function showLogin(msg=''){
  document.getElementById('appShell').style.display = 'none';
  const el = document.getElementById('loginScreen');
  el.style.display = 'grid';
  const err = document.getElementById('loginErr');
  if(err) err.textContent = msg;
}

async function doLogin(){
  const email = document.getElementById('lgEmail').value.trim();
  const pass  = document.getElementById('lgPass').value;
  const btn   = document.getElementById('lgBtn');
  if(!email || !pass){ document.getElementById('loginErr').textContent = 'Email dan kata sandi harus diisi.'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Masuk...';
  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if(error){
    btn.disabled = false; btn.textContent = 'Masuk';
    document.getElementById('loginErr').textContent = 'Email atau kata sandi tidak cocok.';
    return;
  }
  await startApp(data.session);
}

async function startApp(session){
  await loadProfile(session);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  document.getElementById('sideDate').textContent = new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'});
  document.getElementById('avatarInit').textContent = ME.name.slice(0,2).toUpperCase();
  document.getElementById('whoName').textContent = ME.name;
  document.getElementById('whoRole').textContent = ME.role;
  try{
    S = await fetchAll();
  }catch(e){
    console.error(e);
    showLogin('Gagal memuat data. Periksa koneksi lalu coba lagi.');
    return;
  }
  render();
  listenRealtime();
}

/* ---------- boot ---------- */
(async function init(){
  document.getElementById('lgBtn').addEventListener('click', doLogin);
  document.getElementById('lgPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  const { data } = await db.auth.getSession();
  if(data.session) await startApp(data.session);
  else showLogin();
})();
</script>
