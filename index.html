<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wondergift · Social Media Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#12132A;
  --ink-2:#1B1D3A;
  --ink-3:#2A2C52;
  --paper:#F6F7FB;
  --card:#FFFFFF;
  --line:#E7E9F2;
  --text:#1F2340;
  --muted:#6E7392;
  --blue:#3B5BFF;
  --violet:#7C3AED;
  --green:#12A46B;
  --orange:#F0871A;
  --red:#E24A4A;
  --grey:#98A0BC;
  --radius:18px;
  --shadow:0 1px 2px rgba(18,19,42,.04), 0 12px 32px -18px rgba(18,19,42,.28);
  --shadow-lg:0 24px 60px -30px rgba(18,19,42,.45);
  --sidebar-w:258px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Safari merentangkan SVG tanpa ukuran bawaan sampai selebar kotaknya.
   Aturan ini memberi ukuran default; setiap aturan class di bawah tetap menang. */
svg{width:16px;height:16px;flex:0 0 auto;vertical-align:middle}
.card-head > svg,.cal-head > svg{width:18px;height:18px;color:var(--violet)}
.filter-note > svg,.list-item > svg,.ag-item > svg{width:16px;height:16px;color:var(--muted)}
.modal-head > svg{width:18px;height:18px;color:var(--violet)}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--paper);color:var(--text);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::selection{background:#DDE2FF}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--ink);color:#fff;
  position:fixed;inset:0 auto 0 0;z-index:60;display:flex;flex-direction:column;
  padding:22px 16px;transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand-mark{
  width:38px;height:38px;border-radius:12px;flex:0 0 38px;
  background:linear-gradient(140deg,var(--blue),var(--violet));
  display:grid;place-items:center;font-family:'Fraunces',serif;font-size:19px;color:#fff;
  box-shadow:0 8px 20px -8px rgba(124,58,237,.9);
}
.brand-name{font-family:'Fraunces',Georgia,serif;font-size:17px;letter-spacing:.2px;line-height:1.15}
.brand-sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7C82AE;margin-top:3px}
.nav-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#666C96;padding:14px 12px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  background:none;border:0;cursor:pointer;color:#B9BEDC;text-align:left;width:100%;
  font-weight:500;transition:background .16s,color .16s;position:relative;
}
.nav-item:hover{background:var(--ink-2);color:#fff}
.nav-item.is-active{background:linear-gradient(100deg,rgba(59,91,255,.9),rgba(124,58,237,.85));color:#fff;box-shadow:0 10px 22px -14px rgba(124,58,237,1)}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.95}
.nav-count{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.nav-item.is-active .nav-count{background:rgba(255,255,255,.24)}
.side-foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7C82AE}
.side-foot b{color:#D5D9F0;font-weight:600}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:14px 26px;background:rgba(246,247,251,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.burger{display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer}
.burger svg{width:18px;height:18px;display:block}
.crumb{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.top-title{font-family:'Fraunces',Georgia,serif;font-size:19px;line-height:1.2}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;display:grid;place-items:center;transition:.16s}
.icon-btn:hover{border-color:#C9CFEA;transform:translateY(-1px)}
.icon-btn svg{width:17px;height:17px}
.dot-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--paper)}
.who{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 12px 5px 5px}
.avatar{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--violet),var(--blue));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.who-name{font-weight:600;font-size:12.5px;line-height:1.2}
.who-role{font-size:10.5px;color:var(--muted)}
.view{padding:24px 26px 60px;max-width:1240px;width:100%}

/* ---------- Page furniture ---------- */
.page-head{margin-bottom:18px}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--violet);font-weight:700}
.page-title{font-family:'Fraunces',Georgia,serif;font-size:27px;line-height:1.15;margin-top:6px}
.page-lead{color:var(--muted);margin-top:7px;max-width:70ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14.5px;font-weight:700}
.card-head .sub{font-size:12px;color:var(--muted);font-weight:500}
.card-body{padding:20px}
.card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.objective{
  display:flex;gap:13px;padding:15px 17px;border-radius:14px;
  background:linear-gradient(100deg,rgba(59,91,255,.07),rgba(124,58,237,.07));
  border:1px solid rgba(124,58,237,.16);
}
.objective .o-ico{font-size:17px;line-height:1.3}
.objective h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);margin-bottom:4px}
.objective p{font-size:13.5px}
.desc p{margin-top:9px;color:#41466B}
.desc p:first-child{margin-top:0}

/* ---------- Signature: workflow stepper ---------- */
.wf-toggle{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 13px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--blue);transition:.16s;
}
.wf-toggle:hover{background:#F2F4FF;border-color:#C6CFFF}
.wf-wrap{overflow:hidden;transition:max-height .34s cubic-bezier(.4,0,.2,1),opacity .24s;max-height:520px;opacity:1}
.wf-wrap.is-hidden{max-height:0;opacity:0}
.wf{display:flex;align-items:flex-start;gap:0;padding:24px 20px 20px;overflow-x:auto}
.step{flex:1 1 0;min-width:104px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.step::before,.step::after{content:"";position:absolute;top:21px;height:2px;background:var(--line);width:50%}
.step::before{left:0}
.step::after{right:0}
.step:first-child::before,.step:last-child::after{display:none}
.step.done::before,.step.done::after,.step.current::before{background:var(--green)}
.step.current::after{background:var(--line)}
.step-dot{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#F1F3FA;color:var(--grey);
  border:2px solid #E4E7F3;position:relative;z-index:2;transition:.2s;
}
.step-dot svg{width:18px;height:18px}
.step-name{font-size:11.5px;font-weight:600;margin-top:9px;color:var(--muted);max-width:118px}
.step.done .step-dot{background:#E6F7F0;border-color:var(--green);color:var(--green)}
.step.done .step-name{color:var(--green)}
.step.current .step-dot{background:#E9EDFF;border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 6px rgba(59,91,255,.11)}
.step.current .step-name{color:var(--blue)}
.step.revision .step-dot{background:#FFF2E2;border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 6px rgba(240,135,26,.12)}
.step.revision .step-name{color:var(--orange)}
.wf-legend{display:flex;flex-wrap:wrap;gap:16px;padding:0 20px 18px;font-size:11.5px;color:var(--muted)}
.wf-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}

/* ---------- Forms ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#4A4F73;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#FCFCFE;
  transition:.16s;outline:none;
}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(59,91,255,.11)}
.field .hint{font-size:11px;color:var(--muted);margin-top:5px}

.day-row{display:grid;grid-template-columns:104px 1fr 1fr;gap:12px;align-items:start;padding:13px 0;border-top:1px dashed var(--line)}
.day-row:first-child{border-top:0;padding-top:0}
.day-tag{display:flex;flex-direction:column;gap:3px;padding-top:6px}
.day-name{font-weight:700;font-size:13px}
.day-date{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}

.box{border:1px solid var(--line);border-radius:14px;padding:14px;background:#FCFCFE}
.box-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.box-num{
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:linear-gradient(140deg,var(--blue),var(--violet));color:#fff;font-family:'JetBrains Mono',monospace;
}
.box-title{font-size:12.5px;font-weight:700}
.box .field + .field{margin-top:10px}

.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s}
.check:hover{border-color:#C6CFFF}
.check input{accent-color:var(--violet);width:15px;height:15px}
.check.on{background:#F3F0FF;border-color:#D6CBFF;color:#5B21B6}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-weight:600;cursor:pointer;transition:.16s;
}
.btn:hover{transform:translateY(-1px);border-color:#C9CFEA}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(100deg,var(--blue),var(--violet));color:#fff;border-color:transparent;box-shadow:0 12px 24px -14px rgba(124,58,237,.95)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Badges / progress ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-progress{background:#EEF1FF;color:#3B5BFF}
.b-submitted{background:#F1EDFF;color:#6D28D9}
.b-review{background:#FFF6E5;color:#B45309}
.b-revision{background:#FFEDE3;color:#C2410C}
.b-approved{background:#E6F7F0;color:#0F7A52}
.b-grey{background:#F1F2F7;color:#6E7392}
.b-red{background:#FDECEC;color:#C33}

.prog{height:9px;border-radius:20px;background:#EEF0F8;overflow:hidden}
.prog span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog.rev span{background:linear-gradient(90deg,var(--orange),#F0A81A)}
.prog.ok span{background:linear-gradient(90deg,var(--green),#3CC98C)}
.prog-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.prog-head .pct{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:11px 16px;background:#FAFBFE;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
tbody tr:hover{background:#FBFBFF}
.t-main{font-weight:600}
.t-sub{font-size:11.5px;color:var(--muted)}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}

/* ---------- Dashboard ---------- */
.flowstrip{
  border-radius:20px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#181A38 0%,#2A2360 58%,#402890 100%);
  box-shadow:var(--shadow);
}
.hero-eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#9E9ED8}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.stat:hover{transform:translateY(-2px);border-color:#D3D9F5}
.stat-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:11px}
.stat-ico svg{width:16px;height:16px}
.stat-num{font-family:'Fraunces',serif;font-size:25px;line-height:1}
.stat-lab{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}

.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px;align-items:start}
.timeline{position:relative;padding-left:8px}
.tl{display:flex;gap:13px;padding:0 0 17px;position:relative}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl-dot{width:20px;height:20px;border-radius:7px;flex:0 0 20px;display:grid;place-items:center;background:#EEF1FF;color:var(--blue);z-index:2}
.tl-dot svg{width:11px;height:11px}
.tl-txt{font-size:13px}
.tl-time{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.notif{display:flex;gap:11px;padding:12px;border-radius:12px;border:1px solid var(--line);align-items:flex-start}
.notif + .notif{margin-top:9px}
.notif-ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 28px}
.notif-ico svg{width:14px;height:14px}
.notif p{font-size:12.8px}
.notif small{color:var(--muted);font-size:11px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa-btn{display:flex;flex-direction:column;gap:7px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#FCFCFE;cursor:pointer;text-align:left;transition:.16s}
.qa-btn:hover{border-color:var(--blue);background:#F6F8FF;transform:translateY(-2px)}
.qa-btn svg{width:17px;height:17px;color:var(--violet)}
.qa-t{font-weight:700;font-size:12.5px}
.qa-s{font-size:11px;color:var(--muted)}

/* ---------- Monitoring ---------- */
.mon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mon{border:1px solid var(--line);border-radius:14px;padding:14px;background:#FCFCFE}
.mon-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mon-val{font-family:'Fraunces',serif;font-size:22px;margin:7px 0 4px}
.health{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:600}
.pulse{width:9px;height:9px;border-radius:50%;position:relative}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:.32;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.list-item{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,19,42,.42);backdrop-filter:blur(5px);z-index:90;display:none;place-items:center;padding:20px}
.overlay.on{display:grid;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(620px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);animation:pop .24s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:'Fraunces',serif;font-size:18px}
.modal-body{padding:22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);background:#FAFBFE;border-radius:0 0 20px 20px}
.x-btn{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.report{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:pre-wrap;background:#FAFBFE;border:1px solid var(--line);border-radius:12px;padding:16px;line-height:1.75}

.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:9px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:13px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;animation:slide .26s cubic-bezier(.34,1.4,.64,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.toast.warn .tdot{background:var(--orange)}

.skeleton{padding:40px}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,#EDEFF7 25%,#F7F8FC 50%,#EDEFF7 75%);background-size:200% 100%;animation:shim 1.1s infinite}
.sk + .sk{margin-top:12px}
.sk.w1{width:34%}.sk.w2{width:66%}.sk.w3{width:50%}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- Filter bar ---------- */
.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:#FBFBFE;border-radius:var(--radius) var(--radius) 0 0}
.filters .field input,.filters .field select{padding:8px 10px;font-size:12.5px;background:#fff}
.filter-note{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.filter-note .grow{flex:1}

/* ---------- Checklist ---------- */
.chk-group{border:1px solid var(--line);border-radius:14px;padding:15px;background:#FCFCFE}
.chk-group h5{font-size:12.5px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.chk-group h5 svg{width:15px;height:15px;color:var(--violet)}
.chk-group .cap{font-size:11.5px;color:var(--muted);margin-bottom:11px}
.chk{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:12.5px;transition:.14s;border:1px solid transparent}
.chk:hover{background:#F5F6FC}
.chk input{accent-color:var(--violet);width:15px;height:15px;flex:0 0 15px}
.chk.on{background:#F1FBF6;border-color:#CBEBDC;color:#0F7A52;font-weight:600}
.chk.sub{margin-left:20px;font-size:12px}
.chk-score{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- Insight ---------- */
.insight-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.ins{border:1px solid var(--line);border-radius:13px;padding:13px;background:#FCFCFE}
.ins-num{font-family:'Fraunces',serif;font-size:23px;line-height:1}
.ins-lab{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600}
.ins-line{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ins-line:last-child{border-bottom:0}
.ins-line svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.ins-ok{color:var(--green)}.ins-warn{color:var(--orange)}.ins-info{color:var(--blue)}
.rec{display:flex;gap:11px;padding:12px 13px;border-radius:12px;background:linear-gradient(100deg,rgba(59,91,255,.05),rgba(124,58,237,.06));border:1px solid rgba(124,58,237,.14);font-size:13px}
.rec + .rec{margin-top:9px}
.rec-num{width:21px;height:21px;flex:0 0 21px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(140deg,var(--blue),var(--violet));color:#fff;font-size:10.5px;font-weight:800;font-family:'JetBrains Mono',monospace}
.auto-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);background:#F3F0FF;padding:3px 9px;border-radius:20px}

/* ---------- Free-text reporting points ---------- */
.pt-row{display:grid;grid-template-columns:150px 1fr 36px;gap:11px;align-items:start;padding:13px;border:1px solid var(--line);border-radius:13px;background:#FCFCFE}
.pt-row + .pt-row{margin-top:10px}
.pt-del{border:1px solid var(--line);background:#fff;border-radius:10px;height:38px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;transition:.15s}
.pt-del:hover{border-color:#F3C4C4;color:var(--red);background:#FEF6F6}
.pt-empty{border:1px dashed var(--line);border-radius:13px;padding:22px;text-align:center;color:var(--muted);font-size:12.5px}
.pt-cat{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:#F1EDFF;color:#6D28D9}

/* ---------- Brief builder ---------- */
.dyn-list{display:flex;flex-direction:column;gap:9px}
.dyn-row{display:grid;grid-template-columns:118px 1fr 34px;gap:10px;align-items:center}
.dyn-num{font-size:11.5px;font-weight:700;color:#4A4F73;display:flex;flex-direction:column}
.dyn-num small{font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.04em}
.dyn-row input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#FCFCFE;outline:none;transition:.16s}
.dyn-row input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(59,91,255,.11)}
.btn-rm{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;transition:.15s}
.btn-rm:hover:not(:disabled){border-color:#F3C0C0;background:#FDF3F3;color:var(--red)}
.btn-rm:disabled{opacity:.35;cursor:not-allowed}
.use-steps{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.use-step{display:flex;align-items:center;gap:9px;font-size:12.5px}
.use-arrow{color:var(--grey);font-size:17px}

/* ---------- Tab bar per modul ---------- */
.tabbar{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabb{
  display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:0;background:none;cursor:pointer;
  font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:.16s;border-radius:10px 10px 0 0;
}
.tabb:hover{color:var(--text);background:#F4F5FB}
.tabb.on{color:var(--blue);border-bottom-color:var(--blue);background:linear-gradient(180deg,rgba(59,91,255,.06),transparent)}
.tab-count{font-size:11px;font-weight:800;background:#EEF1FF;color:var(--blue);padding:1px 7px;border-radius:20px}
.tabb.on .tab-count{background:var(--blue);color:#fff}
.tabpanel{animation:tabfade .22s ease}
@keyframes tabfade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.tabpanel > .card:first-child{margin-top:0}

/* ---------- Date picker & kalender ---------- */
.datepick{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cal-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;
  display:grid;place-items:center;color:var(--violet);transition:.16s;
}
.cal-btn:hover{border-color:var(--violet);background:#F7F4FF;transform:translateY(-1px)}
.cal-btn svg{width:19px;height:19px}
.datepick input[type=date]{flex:1;min-width:150px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#FCFCFE;outline:none}
.datepick input[type=date]:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(59,91,255,.11)}
.range-note{font-size:12px;color:var(--violet);font-weight:600;background:#F3F0FF;padding:6px 12px;border-radius:20px;white-space:nowrap}

.cal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.cal-title{font-family:'Fraunces',Georgia,serif;font-size:18px;min-width:180px}
.cal-nav{display:flex;gap:6px;margin-left:auto;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.cal-dow{background:#FAFBFE;padding:9px 6px;text-align:center;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cal-cell{
  background:#fff;min-height:96px;padding:8px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:4px;
  border:0;text-align:left;font:inherit;color:inherit;
}
.cal-cell:hover{background:#F7F8FE}
.cal-cell.out{background:#FCFCFE;color:var(--grey)}
.cal-num{font-size:12.5px;font-weight:700;width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.cal-cell.today .cal-num{background:linear-gradient(140deg,var(--blue),var(--violet));color:#fff}
.cal-cell.weekend .cal-num{color:var(--red)}
.cal-chip{
  font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:100%;
}
.chip-story{background:#EEF1FF;color:#3B5BFF}
.chip-campaign{background:#F1EDFF;color:#6D28D9}
.chip-ads{background:#E6F7F0;color:#0F7A52}
.chip-report{background:#FFF6E5;color:#B45309}
.chip-event{background:#FDECEC;color:#C33}
.cal-more{font-size:10px;color:var(--muted);font-weight:600}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;padding:14px 20px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.cal-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.ag-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ag-item:last-child{border-bottom:0}
.ag-item .grow{flex:1;min-width:0}
@media(max-width:820px){.cal-cell{min-height:70px;padding:5px}.cal-chip{font-size:9px;padding:1px 4px}.cal-title{font-size:15px;min-width:120px}}

/* ---------- Mini kalender di sidebar ---------- */
.side-cal{
  margin:16px 2px 0;padding:13px 12px 11px;border-radius:15px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
  transition:.18s;font:inherit;color:inherit;display:block;width:calc(100% - 4px);
}
.side-cal:hover{background:rgba(255,255,255,.075);border-color:rgba(124,58,237,.5);transform:translateY(-1px)}
.sc-head{display:flex;align-items:baseline;gap:6px;margin-bottom:10px}
.sc-month{font-size:12px;font-weight:700;color:#E4E7F8;letter-spacing:.01em}
.sc-year{font-size:10px;color:#6E74A0;margin-left:auto;font-family:'JetBrains Mono',monospace}
.sc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.sc-dow{font-size:8.5px;text-align:center;color:#5D6394;font-weight:700;letter-spacing:.04em;padding-bottom:4px}
.sc-d{position:relative;font-size:10.5px;line-height:1;text-align:center;padding:5px 0 6px;border-radius:8px;color:#AEB4D6;font-variant-numeric:tabular-nums}
.sc-d.out{color:#3B4070}
.sc-d.sun{color:#8C7BC9}
.sc-d.on{background:linear-gradient(140deg,var(--blue),var(--violet));color:#fff;font-weight:800;box-shadow:0 7px 16px -9px rgba(124,58,237,1)}
.sc-d.has::after{content:"";position:absolute;left:50%;bottom:1.5px;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#7C82D8}
.sc-d.on.has::after{background:rgba(255,255,255,.9)}
.sc-foot{margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:#8B90B8;display:flex;align-items:center;gap:7px}
.sc-foot b{color:#D5D9F0;font-weight:600}
.sc-foot svg{width:12px;height:12px;flex:0 0 12px;opacity:.7}

/* ---------- Panduan SOP ---------- */
.sop-stage{
  background:#12132A;border-radius:16px;padding:14px;display:grid;place-items:center;min-height:200px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.sop-stage img{max-width:100%;max-height:64vh;border-radius:9px;display:block;box-shadow:0 18px 40px -22px rgba(0,0,0,.85)}
.sop-bar{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.sop-count{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--muted);min-width:70px}
.sop-track{flex:1;min-width:120px;height:5px;border-radius:20px;background:#EEF0F8;overflow:hidden}
.sop-track span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .35s cubic-bezier(.4,0,.2,1)}
.sop-thumbs{display:flex;gap:7px;overflow-x:auto;padding:14px 2px 4px;margin-top:6px}
.sop-thumb{
  flex:0 0 78px;height:46px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;
  padding:0;background:#F1F3FA;transition:.15s;position:relative;
}
.sop-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.62;transition:.15s}
.sop-thumb:hover img{opacity:.9}
.sop-thumb.on{border-color:var(--violet);box-shadow:0 6px 14px -8px rgba(124,58,237,.9)}
.sop-thumb.on img{opacity:1}
.sop-thumb b{position:absolute;left:3px;top:2px;font-size:9px;color:#fff;background:rgba(18,19,42,.72);border-radius:4px;padding:0 4px;font-family:'JetBrains Mono',monospace}

/* ---------- Flow tiga fase di hero ---------- */
.phaseflow{display:flex;align-items:stretch;gap:8px}
.phase{
  flex:1;min-width:112px;padding:12px 13px;border-radius:14px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);
}
.phase-k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#9E9ED8;font-weight:700}
.phase-t{font-size:13px;font-weight:700;color:#fff;margin:5px 0 7px;line-height:1.25}
.phase-s{font-size:10.5px;color:#B6BAE4;line-height:1.5}
.phase-n{
  display:inline-block;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.14);color:#DDE0F5;
}
.phase-ar{display:grid;place-items:center;color:#6E74A8;font-size:15px;flex:0 0 12px}
@media(max-width:900px){.phaseflow{flex-wrap:wrap}.phase-ar{display:none}.phase{min-width:calc(50% - 6px)}}

/* ---------- Kotak campaign ---------- */
.boxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
/* feed ganjil (1,3,5) = blok bertint; feed genap (2,4,6) = dasar netral */
.box.odd{background:linear-gradient(160deg,rgba(59,91,255,.10),rgba(59,91,255,.035) 70%);border-color:#C9D4F8}
.box.even{background:#FCFCFE;border-color:var(--line)}
.box .box-head{margin-bottom:14px}
.box.odd .box-num{background:linear-gradient(140deg,#3B5BFF,#5B7CFF)}
.box.even .box-num{background:linear-gradient(140deg,#7C3AED,#A855F7)}
.box-num{width:30px;height:30px;border-radius:10px;font-size:13px}
.box-title{font-size:13.5px}
.box-slot{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);padding:2px 9px;border-radius:20px;white-space:nowrap}
@media(max-width:1100px){.boxgrid{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(max-width:760px){.boxgrid{grid-template-columns:1fr}}

/* ---------- Checklist QC ---------- */
.qc-card{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.qc-card + .qc-card{margin-top:14px}
.qc-top{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qc-name{font-weight:700;font-size:14.5px}
.qc-meta{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.qc-ring{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--muted);
  background:conic-gradient(var(--green) calc(var(--p) * 1%), #EEF0F8 0);
}
.qc-ring i{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal}
.qc-ring.full{color:var(--green)}
.qc-body{padding:6px 18px 14px}
.qc-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.qc-row:last-child{border-bottom:0}
.qc-box{
  width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:2px solid #D5DAEA;background:#fff;cursor:pointer;
  display:grid;place-items:center;margin-top:1px;transition:.15s;padding:0;color:transparent;
}
.qc-box:hover{border-color:var(--green)}
.qc-box svg{width:13px;height:13px}
.qc-box.on{background:var(--green);border-color:var(--green);color:#fff}
.qc-label{font-weight:700;font-size:12.5px;min-width:104px;color:#4A4F73}
.qc-row.done .qc-label{color:var(--green)}
.qc-desc{flex:1;min-width:150px;font-size:12.5px;color:var(--muted)}
.qc-actions{margin-left:auto;display:flex;gap:6px}
.qc-empty-note{font-size:11.5px;color:var(--muted);margin-top:4px}
.qc-add{display:grid;grid-template-columns:1.6fr 1fr auto;gap:12px;align-items:end}
@media(max-width:820px){.qc-add{grid-template-columns:1fr}.qc-row{flex-wrap:wrap}.qc-label{min-width:auto}}

/* ---------- Layar masuk ---------- */
.login{
  position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:200;
  background:linear-gradient(135deg,#12132A 0%,#241D52 55%,#3F2790 100%);
}
.login::after{
  content:"";position:absolute;right:-140px;bottom:-160px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,rgba(124,58,237,.5),transparent 66%);
}
.login-card{
  position:relative;z-index:2;width:min(400px,100%);background:#fff;border-radius:22px;
  padding:32px 30px;box-shadow:var(--shadow-lg);
}
.login-mark{
  width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin-bottom:18px;
  background:linear-gradient(140deg,var(--blue),var(--violet));color:#fff;
  font-family:'Fraunces',serif;font-size:23px;box-shadow:0 12px 26px -12px rgba(124,58,237,.95);
}
.login-card h1{font-family:'Fraunces',Georgia,serif;font-size:22px;line-height:1.2}
.login-sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.login-err{color:var(--red);font-size:12.5px;font-weight:600;margin-top:12px;min-height:17px}
.login-foot{font-size:11.5px;color:var(--muted);margin-top:16px;text-align:center;line-height:1.5}
.netdot{
  width:8px;height:8px;border-radius:50%;background:var(--violet);opacity:0;transition:opacity .2s;
  box-shadow:0 0 0 4px rgba(124,58,237,.16);
}
.who{cursor:pointer}

/* ---------- Create Activity ---------- */
.act-card{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.act-card + .act-card{margin-top:14px}
.act-top{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.act-name{font-weight:700;font-size:14.5px}
.act-meta{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.act-body{padding:6px 18px 14px}
.act-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.act-row:last-child{border-bottom:0}
.act-txt{flex:1;min-width:140px;font-size:13px}
.act-row.done .act-txt{color:var(--muted);text-decoration:line-through;text-decoration-color:#C8CCE0}
.act-due{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);background:#F5F6FC;padding:2px 8px;border-radius:20px;white-space:nowrap}
.act-due.late{background:#FDECEC;color:var(--red);font-weight:700}
.act-due.today{background:#EEF1FF;color:var(--blue);font-weight:700}
.act-new{display:grid;grid-template-columns:1.6fr 1fr auto;gap:12px;align-items:end}
.act-quick{display:grid;grid-template-columns:1fr 150px auto;gap:10px;align-items:end;margin-top:12px;padding-top:13px;border-top:1px dashed var(--line)}
@media(max-width:820px){.act-new,.act-quick{grid-template-columns:1fr}}

/* ---------- Progress ringkas ---------- */
.pg-list{max-height:none}
.pg-row{
  display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line);
  transition:background .14s;
}
.pg-row:last-child{border-bottom:0}
.pg-row:hover{background:#FBFBFF}
.pg-main{flex:1 1 220px;min-width:0}
.pg-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-bar{flex:0 0 110px}
.pg-bar .prog{height:5px}
.pg-pct{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--muted);flex:0 0 34px;text-align:right}
.pg-row .row-actions .btn{padding:4px 9px;font-size:11px}
@media(max-width:900px){
  .pg-row{flex-wrap:wrap;gap:8px;padding:11px 14px}
  .pg-bar{flex:1 1 100%;order:5}
  .pg-pct{flex:0 0 auto}
}

/* ---------- QC ringkas & bisa dilipat ---------- */
.qc-top{cursor:pointer}
.qc-caret{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;color:var(--muted);transition:.18s;padding:0;margin-left:4px;
}
.qc-caret svg{width:14px;height:14px;transition:transform .22s}
.qc-card.open .qc-caret{background:#F2F4FF;border-color:#C6CFFF;color:var(--blue)}
.qc-card.open .qc-caret svg{transform:rotate(180deg)}
.qc-card:not(.open) .qc-body{display:none}
.qc-card .qc-top{padding:11px 16px}
.qc-card .qc-ring{width:38px;height:38px;flex:0 0 38px;font-size:10px}
.qc-card .qc-ring i{width:29px;height:29px}
.qc-name{font-size:13.5px}
.act-card .qc-caret{margin-left:4px}
.act-card:not(.open) .act-body{display:none}
.act-card.open .qc-caret{background:#F2F4FF;border-color:#C6CFFF;color:var(--blue)}
.act-card.open .qc-caret svg{transform:rotate(180deg)}

/* Membaca seluruh isi workspace dari server. */
async function fetchAll(){
  const [rec, set, log] = await Promise.all([
    db.from('records').select('id, kind, data').order('updated_at', {ascending:true}),
    db.from('settings').select('key, data'),
    db.from('activity_log').select('*').order('ts', {ascending:false}).limit(300)
  ]);
  if(rec.error) throw rec.error;

  const st = { stories:[], campaigns:[], boosters:[], ads:[], reports:[], briefs:[], events:[], qc:[], tasks:[],
               checklist:blankChecklist(), eventOpts:[...EVENT_DEFAULT], log:[], activity:[] };

  (rec.data||[]).forEach(r=>{
    const b = KIND_BUCKET[r.kind];
    if(b) st[b].push({ ...r.data, id:r.id });
  });
  (set.data||[]).forEach(x=>{
    if(x.key==='checklist' && x.data && Object.keys(x.data).length) st.checklist = x.data;
    if(x.key==='campaign_events' && Array.isArray(x.data?.list) && x.data.list.length) st.eventOpts = x.data.list;
  });

  st.log = (log.data||[]).map(l=>({
    id:l.id, ts:(l.ts||'').slice(0,16), text:l.text, module:l.module, status:l.status,
    detail:l.detail||'', icon:l.icon||'spark', ref:l.ref||null,
    by:l.actor_role || 'Social Media Specialist', actor:l.actor_name || ''
  }));
  st.activity = st.log.slice(0,12).map(l=>({ t:l.text, time:(l.ts||'').slice(11,16), icon:l.icon }));

  // lengkapi kunci checklist yang mungkin belum ada
  Object.entries(CHECKLIST_DEF).forEach(([g,d])=>{
    st.checklist[g] = st.checklist[g] || {};
    d.items.forEach(([k])=>{ if(typeof st.checklist[g][k] !== 'boolean') st.checklist[g][k] = false; });
  });
  return st;
}

async function saveRecord(kind, rec){
  netFlag(true);
  const { id, ...data } = rec;
  const { error } = await db.from('records').upsert({ id, kind, data });
  netFlag(false);
  if(error){ console.error(error); toast('Gagal menyimpan ke server.', true); return false; }
  return true;
}
async function deleteRecord(id){
  netFlag(true);
  const { error } = await db.from('records').delete().eq('id', id);
  netFlag(false);
  if(error){ console.error(error); toast('Gagal menghapus di server.', true); return false; }
  return true;
}
async function saveSetting(key, data){
  netFlag(true);
  const { error } = await db.from('settings').upsert({ key, data });
  netFlag(false);
  if(error) console.error(error);
}

const FLOWS = {
  story:[['Planning Story','plan'],['Design di Canva','brush'],['Submit Story','send'],['Review & QC','shield'],['Revision','refresh'],['Final Approval','check'],['Admin Upload','upload']],
  campaign:[['Planning Campaign','plan'],['Design di Canva','brush'],['Lengkapi Caption','file'],['Submit Campaign','send'],['Review & QC','shield'],['Revision','refresh'],['Final Approval','check'],['Admin Upload','upload']],
  booster:[['Campaign Published','flag'],['Copy Link','link'],['Submit Booster','send'],['Boosting Activity','heart'],['Monitoring','eye'],['Completed','check']],
  ads:[['Founder Request','flag'],['Setup Campaign','plan'],['Review','shield'],['Ads Running','play'],['Monitoring','eye'],['Campaign Finished','check'],['Result Report','chart']],
  report:[['Collect Data','plan'],['Draft Report','file'],['Submit Report','send'],['Review & QC','shield'],['Revision','refresh'],['Final Approved','check']],
  brief:[['Isi Brief','plan'],['Generate Prompt','spark'],['Copy Prompt','file'],['Proses di ChatGPT','bolt'],['Aset siap dipakai','check']]
};
// index step aktif berdasarkan status record terakhir
function activeStep(mod, status){
  if(!status) return 0;
  if(mod==='story'){ return {'In Progress':1,'Submitted':2,'Review & QC':3,'Revision':4,'Final Approved':5}[status] ?? 0; }
  if(mod==='campaign'){ return {'In Progress':1,'Submitted':3,'Review & QC':4,'Revision':5,'Final Approved':6}[status] ?? 0; }
  if(mod==='booster'){ return {'In Progress':2,'Submitted':3,'Review & QC':4,'Revision':3,'Final Approved':5}[status] ?? 0; }
  if(mod==='ads'){ return {'In Progress':1,'Submitted':2,'Review & QC':2,'Revision':2,'Ads Running':3,'Final Approved':6}[status] ?? 0; }
  if(mod==='report'){ return {'In Progress':1,'Submitted':2,'Review & QC':3,'Revision':4,'Final Approved':5}[status] ?? 0; }
  if(mod==='brief'){ return {'In Progress':1,'Submitted':2,'Final Approved':4}[status] ?? 0; }
  return 0;
}

function workflowCard(mod, status){
  const steps = FLOWS[mod];
  const cur = activeStep(mod, status);
  const isRev = status === 'Revision';
  const html = steps.map(([name,icon],i)=>{
    let cls = 'step';
    if(i < cur) cls += ' done';
    else if(i === cur) cls += isRev ? ' revision current' : ' current';
    if(name==='Revision' && !isRev && i>cur) cls = 'step';
    return `<div class="${cls}"><div class="step-dot">${ic(icon)}</div><div class="step-name">${name}</div></div>`;
  }).join('');
  return `<section class="card">
    <div class="card-head">
      ${ic('bolt','')}<h3>Workflow</h3>
      <span class="sub">Alur kerja resmi modul ini</span>
      <div class="right"><button class="wf-toggle" data-action="toggle-wf">Hide Workflow</button></div>
    </div>
    <div class="wf-wrap" id="wfWrap">
      <div class="wf">${html}</div>
      <div class="wf-legend">
        <span><i style="background:var(--green)"></i>Selesai</span>
        <span><i style="background:var(--blue)"></i>Sedang berjalan</span>
        <span><i style="background:var(--orange)"></i>Revisi</span>
        <span><i style="background:var(--grey)"></i>Belum dimulai</span>
      </div>
    </div>
  </section>`;
}

function shell(eyebrow, title, tabs){
  const ids = tabs.map(t=>t.id);
  const active = ids.includes(TAB[route]) ? TAB[route] : ids[0];
  const bar = tabs.map(t=>`<button class="tabb ${t.id===active?'on':''}" data-action="tab" data-tab="${t.id}">
      <span>${t.label}</span>${t.count?`<span class="tab-count">${t.count}</span>`:''}</button>`).join('');
  const panel = (tabs.find(t=>t.id===active) || tabs[0]).html;
  return pageHeadHtml(eyebrow, title) + `<div class="tabbar">${bar}</div><div class="tabpanel">${panel}</div>`;
}
function activeTab(ids){ return ids.includes(TAB[route]) ? TAB[route] : ids[0]; }

function progressCard(mod, arr){
  const list = Array.isArray(arr) ? arr : (arr ? [arr] : []);
  if(!list.length) return `<section class="card"><div class="card-head">${ic('chart')}<h3>Progress Status</h3></div>
    <div class="card-body"><div class="empty"><strong>Belum ada submission aktif</strong>Isi form di tab Submission untuk memulai.</div></div></section>`;

  const steps = FLOWS[mod].length - 1;
  // baris ringkas, terbaru di atas — tetap terbaca walau submission-nya banyak
  const rows = [...list].reverse().map(x=>{
    const pct = Math.round((activeStep(mod, x.status)/steps)*100);
    const tone = x.status==='Revision' ? 'rev' : (x.status==='Final Approved' ? 'ok' : '');
    return `<div class="pg-row">
      <div class="pg-main">
        <div class="pg-title">${esc(x.title||x.campaign||x.id)}</div>
        <div class="pg-sub mono">${x.id} · ${fmt(x.created)} · ${nextLabel(mod, x.status)}</div>
      </div>
      ${badge(x.status)}
      <div class="pg-bar"><div class="prog ${tone}"><span style="width:${pct}%"></span></div></div>
      <span class="pg-pct">${pct}%</span>
      ${reviewActions(mod, x.id, x.status)}
    </div>`;
  }).join('');

  const belum = list.filter(x=>x.status!=='Final Approved').length;
  return `<section class="card">
    <div class="card-head">${ic('chart')}<h3>Progress Status</h3>
      <span class="sub">${list.length} submission · ${belum} menunggu tindakan</span>
      <div class="right"><button class="btn btn-sm btn-ghost" data-action="go" data-page="history">Activity History</button></div></div>
    <div class="pg-list">${rows}</div>
  </section>`;
}
function nextLabel(mod, status){
  const f = FLOWS[mod], i = activeStep(mod, status);
  return f[i+1] ? f[i+1][0] : 'Selesai';
}

function reviewActions(mod, id, status){
  const btns = [];
  if(mod==='report'){
    btns.push(`<button class="btn btn-sm" data-action="report-view" data-id="${id}">Lihat isi</button>`);
    btns.push(`<button class="btn btn-sm" data-action="report-pdf" data-id="${id}">PDF</button>`);
  }
  if(status!=='Final Approved') btns.push(`<button class="btn btn-sm" data-action="review" data-mod="${mod}" data-id="${id}">Review</button>`);
  btns.push(`<button class="btn btn-sm btn-ghost" data-action="delete" data-mod="${mod}" data-id="${id}">Hapus</button>`);
  return `<div class="row-actions">${btns.join('')}</div>`;
}

/* ============================================================
   CREATE ACTIVITY — progress checklist bebas, di luar modul baku
   ============================================================ */
function dueClass(d){
  if(!d) return '';
  const now = today();
  if(d < now) return 'late';
  if(d === now) return 'today';
  return '';
}
function dueText(d){
  if(!d) return 'tanpa tanggal';
  const now = today();
  if(d < now) return 'lewat · ' + fmt(d);
  if(d === now) return 'hari ini';
  return fmt(d);
}

function activityBuilder(){
  const cards = [...S.tasks].reverse().map(t=>{
    const done = t.items.filter(x=>x.ok).length, total = t.items.length;
    const pct = total ? Math.round(done/total*100) : 0;
    const rows = t.items.map((x,i)=>`
      <div class="act-row ${x.ok?'done':''}">
        <button class="qc-box ${x.ok?'on':''}" data-action="act-toggle" data-id="${t.id}" data-i="${i}" aria-label="Tandai selesai">${ic('check')}</button>
        <span class="act-txt">${esc(x.text)}</span>
        <span class="act-due ${x.ok?'':dueClass(x.due)}">${x.ok?'selesai':dueText(x.due)}</span>
        <span class="qc-actions">
          <button class="btn btn-sm btn-ghost" data-action="act-item-edit" data-id="${t.id}" data-i="${i}">Edit</button>
          <button class="btn btn-sm btn-ghost" data-action="act-item-del" data-id="${t.id}" data-i="${i}">Hapus</button>
        </span>
      </div>`).join('') || `<div class="empty" style="padding:20px"><strong>Belum ada langkah</strong>Tambahkan langkah pertama di bawah.</div>`;

    const open = OPEN_ACT.has(t.id);
    return `<div class="act-card ${open?'open':''}">
      <div class="act-top" data-action="act-fold" data-id="${t.id}">
        <div class="qc-ring ${pct===100&&total?'full':''}" style="--p:${pct}"><i>${done}/${total}</i></div>
        <div>
          <div class="act-name">${esc(t.title)}</div>
          <div class="act-meta">Target ${fmt(t.due)}${t.savedAt?` · disimpan ${fmtTs(t.savedAt)}`:''}</div>
        </div>
        ${total && pct===100
          ? `<span class="badge b-approved"><i></i>Selesai</span>`
          : `<span class="badge ${dueClass(t.due)==='late'?'b-red':'b-progress'}"><i></i>${total-done} langkah tersisa</span>`}
        <span class="qc-actions">
          <button class="btn btn-sm" data-action="act-edit" data-id="${t.id}">Edit</button>
          <button class="btn btn-sm btn-primary" data-action="act-save" data-id="${t.id}">${ic('check')}Save</button>
          <button class="btn btn-sm btn-ghost" data-action="act-del" data-id="${t.id}">Hapus</button>
          <button class="qc-caret" data-action="act-fold" data-id="${t.id}" aria-label="Buka detail">${ic('chevD')}</button>
        </span>
      </div>
      <div class="act-body">
        ${rows}
        <div class="act-quick">
          <div class="field"><label>Langkah baru</label>
            <input id="ai-${t.id}" placeholder="Contoh: kirim draft caption ke Founder"></div>
          <div class="field"><label>Tanggal</label>
            <input id="ad-${t.id}" type="date"></div>
          <button class="btn" data-action="act-item-add" data-id="${t.id}">${ic('spark')}Tambah</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<section class="card">
      <div class="card-head">${ic('plan')}<h3>Create New Activity</h3><span class="sub">Progress checklist bebas di luar modul baku</span></div>
      <div class="card-body">
        <div class="act-new">
          <div class="field"><label>Nama Activity</label>
            <input id="acTitle" placeholder="Persiapan konten Ramadan"></div>
          <div class="field"><label>Target Selesai</label>
            <div class="datepick">
              <button class="cal-btn" data-action="pick-date" data-target="acDue" title="Pilih tanggal">${ic('cal')}</button>
              <input id="acDue" type="date" value="${today()}">
            </div></div>
          <button class="btn btn-primary" data-action="act-add">${ic('spark')}Create Activity</button>
        </div>
        <div class="qc-empty-note">Activity dibuat kosong, lalu diisi langkah sesuai kebutuhan — setiap langkah punya tanggalnya sendiri dan bisa diubah kapan saja.</div>
      </div>
    </section>
    ${S.tasks.length ? cards : `<section class="card"><div class="card-body">
      <div class="empty"><strong>Belum ada activity</strong>Buat yang pertama lewat form di atas.</div>
    </div></section>`}`;
}

/* ---------- Daily Story ---------- */
let storyStart = today();
const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function storyWeek(){
  const d0 = new Date((storyStart||today())+'T00:00:00');
  return Array.from({length:7},(_,i)=>new Date(d0.getTime()+i*864e5));
}
const dayName = d => d.toLocaleDateString('id-ID',{weekday:'long'});
const dayShort = d => d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});
function weekRangeText(){
  const w = storyWeek();
  return `7 hari · ${dayShort(w[0])} – ${dayShort(w[6])}`;
}
// dipanggil tiap kali tanggal awal diubah, tanpa menggambar ulang seluruh halaman
function refreshStoryDates(){
  const w = storyWeek();
  w.forEach((d,i)=>{
    const n = document.getElementById('dn'+i), t = document.getElementById('dd'+i);
    if(n) n.textContent = dayName(d);
    if(t) t.textContent = dayShort(d);
  });
  const r = document.getElementById('weekRange'); if(r) r.textContent = weekRangeText();
  const e = document.getElementById('stEnd');     if(e) e.value = isoOf(w[6]);
  const wk = document.getElementById('stWeek');
  if(wk && !wk.value){
    const t = new Date(w[0]); const jan1 = new Date(t.getFullYear(),0,1);
    wk.value = 'Week ' + Math.ceil(((t - jan1)/864e5 + jan1.getDay()+1)/7);
  }
}

   ============================================================ */
function buildInsight(){
  const st = latest(S.stories);
  const storyMade = st ? st.days.filter(d=>d.desc && d.link).length : 0;
  const storyPub  = st && st.status==='Final Approved' ? storyMade : 0;
  const campApproved = S.campaigns.filter(c=>c.status==='Final Approved');
  const campReview   = S.campaigns.filter(c=>['Submitted','Review & QC'].includes(c.status));
  const boostDone    = S.boosters.filter(b=>b.boxes.some(x=>Object.values(x).some(Boolean)));
  const adsRunning   = S.ads.filter(a=>a.status==='Ads Running');
  const late = S.campaigns.filter(c=>c.target && c.target < today() && c.status!=='Final Approved');
  const revisions = [...S.stories,...S.campaigns,...S.boosters,...S.reports].filter(x=>x.status==='Revision');
  const boostedTitles = new Set(S.boosters.map(b=>b.campaign));
  const notBoosted = campApproved.filter(c=>!boostedTitles.has(c.title));

  const summary = [
    ['Story dibuat', storyMade, 'story'],
    ['Story dipublikasikan', storyPub, 'upload'],
    ['Campaign dibuat', S.campaigns.length, 'campaign'],
    ['Campaign Final Approved', campApproved.length, 'check'],
    ['Campaign masih Review', campReview.length, 'shield'],
    ['Booster selesai', boostDone.length, 'rocket'],
    ['Ads sedang berjalan', adsRunning.length, 'play'],
    ['Item butuh revisi', revisions.length, 'refresh']
  ];

  const ops = [];
  const line = (tone, text) => ops.push({tone, text});
  if(storyMade === 7 && storyPub === 7) line('ok','Seluruh Instagram Story minggu ini telah dipublikasikan sesuai jadwal.');
  else if(storyMade === 7) line('info',`Tujuh hari Story sudah siap, menunggu approval sebelum dipublikasikan.`);
  else line('warn',`${7-storyMade} hari Story minggu ini belum lengkap — berisiko ada hari tanpa Story.`);

  if(!late.length) line('ok','Tidak terdapat campaign yang terlambat dipublikasikan.');
  else line('warn',`${late.length} campaign melewati target posting: ${late.map(c=>c.title).join(', ')}.`);

  if(campReview.length) line('info',`${campReview.length} campaign masih dalam proses Review & QC.`);
  else if(S.campaigns.length) line('ok','Tidak ada campaign yang tertahan di tahap review.');

  if(campApproved.length && !notBoosted.length) line('ok','Seluruh Engagement Booster telah selesai dijalankan.');
  else if(notBoosted.length) line('warn',`${notBoosted.length} campaign Final Approved belum diboost: ${notBoosted.map(c=>c.title).join(', ')}.`);

  line(S.checklist.ig.feed?'ok':'warn', S.checklist.ig.feed
    ? 'Feed Instagram tetap konsisten dengan layout enam kotak.'
    : 'Layout feed enam kotak belum diverifikasi pada checklist Instagram.');

  const tk = CHECKLIST_DEF.tiktok.items.filter(([k])=>S.checklist.tiktok[k]).length;
  line(tk===3?'ok':'warn', tk===3
    ? 'TikTok telah diperbarui dengan seluruh video yang selesai diedit.'
    : `Checklist TikTok baru terisi ${tk} dari 3 poin.`);

  const recs = [];
  campReview.forEach(c=>recs.push(`Segera selesaikan Campaign ${c.title} yang masih berada pada tahap Review & QC.`));
  S.ads.filter(a=>{
    if(a.status!=='Ads Running' || !a.end) return false;
    const sisa = (new Date(a.end) - new Date(today()))/864e5;
    return sisa >= 0 && sisa <= 7;
  }).forEach(a=>recs.push(`Lakukan pengecekan kembali jadwal Ads ${a.campaign} yang akan berakhir ${fmt(a.end)}.`));
  if(revisions.length) recs.push(`Tuntaskan ${revisions.length} item berstatus Revision sebelum laporan mingguan dikirim.`);
  notBoosted.forEach(c=>recs.push(`Jalankan Engagement Booster untuk Campaign ${c.title} yang sudah Final Approved.`));
  const unchecked = Object.keys(CHECKLIST_DEF).reduce((n,g)=>{ const [d,t]=checklistScore(g); return n+(t-d); },0);
  if(unchecked) recs.push(`${unchecked} poin checklist monitoring belum dicentang — lengkapi sebagai dasar laporan.`);
  if(storyMade === 7) recs.push('Pertahankan konsistensi upload Story harian karena seluruh target minggu ini telah tercapai.');
  if(!recs.length) recs.push('Seluruh indikator aman. Fokus pada persiapan campaign periode berikutnya.');

  return {summary, ops, recs};
}

/* ============================================================
   PDF GENERATOR — A4, terstruktur, teks bisa diseleksi
   ============================================================ */
const clean = s => String(s??'')
  .replace(/[\u2013\u2014]/g,'-').replace(/[\u201C\u201D]/g,'"')
  .replace(/[\u2018\u2019]/g,"'").replace(/\u00B7/g,'-').replace(/\u2026/g,'...')
  .replace(/[^\x00-\xFF]/g,'');

function makePDF(rec){
  const JsPDF = window.jspdf && window.jspdf.jsPDF;
  if(!JsPDF){ toast('Library PDF belum termuat — periksa koneksi lalu coba lagi.', true); return; }
  const doc = new JsPDF({unit:'mm', format:'a4'});
  const W=210, H=297, M=18, RW=W-M*2, BOT=272;
  const C = {ink:[18,19,42], blue:[59,91,255], violet:[124,58,237], grey:[110,115,146],
             line:[226,229,241], green:[15,122,82], orange:[194,65,12], soft:[248,249,252]};
  const D = rec.data;
  let y = 0;

  const font=(size,style='normal',color=C.ink)=>{doc.setFont('helvetica',style);doc.setFontSize(size);doc.setTextColor(...color)};
  const wrap=(t,w)=>doc.splitTextToSize(clean(t), w);

  function runningHead(){
    doc.setFillColor(...C.ink); doc.rect(0,0,W,13,'F');
    font(8,'bold',[255,255,255]); doc.text('WONDERGIFT', M, 8.4);
    font(8,'normal',[168,174,214]); doc.text(clean(rec.type)+' - '+clean(rec.period), W-M, 8.4, {align:'right'});
    y = 26;
  }
  function ensure(h){ if(y+h > BOT){ doc.addPage(); runningHead(); } }
  function section(label){
    ensure(16); y += 3;
    doc.setFillColor(...C.violet); doc.rect(M, y-3.6, 1.7, 5, 'F');
    font(11,'bold',C.ink); doc.text(clean(label).toUpperCase(), M+5, y);
    y += 3; doc.setDrawColor(...C.line); doc.setLineWidth(.2); doc.line(M, y, W-M, y); y += 7;
  }
  function para(text, size=9.5, color=C.ink, indent=0){
    const lines = wrap(text, RW-indent);
    lines.forEach(l=>{ ensure(6); font(size,'normal',color); doc.text(l, M+indent, y); y += 4.6; });
  }
  function bullet(marker, text, mColor){
    const lines = wrap(text, RW-11);
    ensure(lines.length*4.6+2);
    font(8.5,'bold',mColor); doc.text(marker, M, y);
    lines.forEach((l,i)=>{ if(i){ ensure(6);} font(9.5,'normal',C.ink); doc.text(l, M+11, y); y += 4.6; });
    y += 1.6;
  }

  /* --- Cover header --- */
  doc.setFillColor(...C.ink); doc.rect(0,0,W,46,'F');
  doc.setFillColor(...C.violet); doc.rect(0,46,W,1.8,'F');
  font(19,'bold',[255,255,255]); doc.text('WONDERGIFT', M, 20);
  font(8,'normal',[150,156,205]); doc.text('SOCIAL MEDIA WORKSPACE', M, 26);
  font(13,'bold',[255,255,255]); doc.text(wrap(rec.title, RW)[0], M, 38);
  font(8,'normal',[168,174,214]); doc.text(clean(rec.type).toUpperCase(), W-M, 20, {align:'right'});
  y = 58;

  /* --- Meta box --- */
  doc.setFillColor(...C.soft); doc.setDrawColor(...C.line);
  doc.roundedRect(M, y, RW, 22, 2, 2, 'FD');
  const meta = [['Periode', rec.period, .40],['Status', rec.status, .20],
                ['Dibuat', fmt(rec.created), .20],
                ['Dicetak', new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}), .20]];
  const fit = (txt, w) => {
    let s = clean(txt||'-');
    while(s.length > 3 && doc.getTextWidth(s) > w) s = s.slice(0,-1);
    return s === clean(txt||'-') ? s : s.slice(0,-3)+'...';
  };
  let mx = M+5;
  meta.forEach(([lab,v,share])=>{
    const colW = RW*share - 5;
    font(7,'bold',C.grey); doc.text(clean(lab).toUpperCase(), mx, y+8);
    font(9.5,'bold',C.ink); doc.text(fit(v, colW), mx, y+15);
    mx += RW*share;
  });
  y += 32;

  /* --- 1. Summary --- */
  section('1. Weekly Summary');
  D.summary.forEach(([lab,num],i)=>{
    ensure(8);
    if(i%2===0){ doc.setFillColor(251,251,254); doc.rect(M, y-4.4, RW, 7.4, 'F'); }
    font(9.5,'normal',C.ink); doc.text(clean(lab), M+3, y);
    font(10,'bold',C.blue); doc.text(String(num), W-M-3, y, {align:'right'});
    y += 7.4;
  });
  y += 4;

  /* --- 2. Operational insight --- */
  section('2. Operational Insight');
  D.ops.forEach(o=>{
    const mk = o.tone==='ok' ? ['[ OK ]', C.green] : (o.tone==='warn' ? ['[ !! ]', C.orange] : ['[ .. ]', C.blue]);
    bullet(mk[0], o.text, mk[1]);
  });
  y += 2;

  /* --- 3. Monitoring checklist --- */
  section('3. Social Media Monitoring');
  Object.keys(CHECKLIST_DEF).forEach(g=>{
    const def = CHECKLIST_DEF[g], cl = D.checklist[g] || {};
    const done = def.items.filter(([k])=>cl[k]).length;
    ensure(12);
    font(9.5,'bold',C.ink); doc.text(clean(def.label), M, y);
    font(9,'bold', done===def.items.length ? C.green : C.orange);
    doc.text(done+'/'+def.items.length, W-M, y, {align:'right'});
    y += 5.6;
    def.items.forEach(([k,label])=>{
      ensure(6);
      const ok = !!cl[k];
      font(9,'bold', ok?C.green:C.grey); doc.text(ok?'[v]':'[ ]', M+3, y);
      font(9,'normal', ok?C.ink:C.grey); doc.text(clean(label), M+11, y);
      y += 5;
    });
    y += 3;
  });

  /* --- 4. Additional points (free text) --- */
  if(rec.points && rec.points.length){
    section('4. Additional Reporting Points');
    rec.points.forEach((p,i)=>{
      ensure(14);
      font(7.5,'bold',C.violet); doc.text(clean(p.cat).toUpperCase(), M, y);
      font(10,'bold',C.ink); doc.text(clean(p.title || 'Poin '+(i+1)), M+26, y);
      y += 5.4;
      if(p.body) para(p.body, 9.5, [55,60,92], 26);
      y += 3;
    });
  }

  /* --- 5. Recommendation --- */
  section((rec.points && rec.points.length ? '5' : '4') + '. Recommendation');
  D.recs.forEach((r,i)=>bullet(String(i+1)+'.', r, C.violet));

  /* --- 6. Notes --- */
  if(rec.notes){
    section((rec.points && rec.points.length ? '6' : '5') + '. Catatan Penyusun');
    para(rec.notes, 9.5, [55,60,92]);
  }

  /* --- Footer di setiap halaman --- */
  const total = doc.getNumberOfPages();
  for(let p=1; p<=total; p++){
    doc.setPage(p);
    doc.setDrawColor(...C.line); doc.setLineWidth(.2); doc.line(M, 281, W-M, 281);
    font(7.5,'normal',C.grey);
    doc.text('Wondergift - dokumen internal - disusun otomatis dari data workspace', M, 286);
    doc.text('Halaman '+p+' dari '+total, W-M, 286, {align:'right'});
  }

  const name = ('Wondergift_'+rec.type+'_'+(rec.period||rec.created)).replace(/[^A-Za-z0-9]+/g,'_').replace(/_+$/,'');
  doc.save(name+'.pdf');
}

let calMonth = today().slice(0,7);
const DOW = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];

// agenda ditarik dari seluruh modul, bukan diinput ulang
function agendaMap(){
  const map = {};
  const put = (date, type, label) => { if(!date) return; (map[date] = map[date] || []).push({type, label}); };
  S.stories.forEach(s=>(s.days||[]).forEach(d=>{ if(d.date && d.desc) put(d.date, 'story', 'Story: ' + d.desc.slice(0,40)); }));
  S.campaigns.forEach(c=>put(c.target, 'campaign', 'Posting: ' + c.title));
  S.ads.forEach(a=>{ put(a.start, 'ads', 'Ads mulai: ' + a.campaign); put(a.end, 'ads', 'Ads berakhir: ' + a.campaign); });
  S.reports.forEach(r=>put(r.created, 'report', r.type + ': ' + r.title));
  (S.events||[]).forEach(e=>put(e.date, 'event', (e.time? e.time+' · ':'') + e.title));
  return map;
}

function calendarCard(){
  const [y,m] = calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const lead = (first.getDay()+6)%7;              // Senin sebagai kolom pertama
  const total = new Date(y, m, 0).getDate();
  const prevTotal = new Date(y, m-1, 0).getDate();
  const map = agendaMap();
  const now = today();

  const cells = [];
  for(let i=lead; i>0; i--) cells.push({n:prevTotal-i+1, out:true});
  for(let d=1; d<=total; d++) cells.push({n:d, out:false, iso:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length % 7) cells.push({n:cells.length-lead-total+1, out:true});

  const grid = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('') + cells.map((c,i)=>{
    if(c.out) return `<div class="cal-cell out"><span class="cal-num">${c.n}</span></div>`;
    const ev = map[c.iso] || [];
    const wknd = (i%7)>=5;
    return `<button class="cal-cell${c.iso===now?' today':''}${wknd?' weekend':''}" data-action="cal-day" data-date="${c.iso}">
      <span class="cal-num">${c.n}</span>
      ${ev.slice(0,3).map(e=>`<span class="cal-chip chip-${e.type}">${esc(e.label)}</span>`).join('')}
      ${ev.length>3?`<span class="cal-more">+${ev.length-3} lainnya</span>`:''}
    </button>`;
  }).join('');

  const label = first.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  return `<section class="card">
    <div class="cal-head">
      ${ic('cal')}<span class="cal-title">${label}</span>
      <div class="cal-nav">
        <button class="btn btn-sm" data-action="cal-today">Hari ini</button>
        <button class="icon-btn" data-action="cal-move" data-dir="-1" aria-label="Bulan sebelumnya">${ic('chevL')}</button>
        <button class="icon-btn" data-action="cal-move" data-dir="1" aria-label="Bulan berikutnya">${ic('chevR')}</button>
      </div>
    </div>
    <div class="cal-grid">${grid}</div>
    <div class="cal-legend">
      <span><i style="background:#3B5BFF"></i>Daily Story</span>
      <span><i style="background:#7C3AED"></i>Campaign posting</span>
      <span><i style="background:#12A46B"></i>Periode Ads</span>
      <span><i style="background:#F0871A"></i>Report</span>
      <span><i style="background:#E24A4A"></i>Agenda &amp; meeting</span>
      <span style="margin-left:auto">Klik tanggal untuk melihat atau menambah agenda.</span>
    </div>
  </section>`;
}

function gcalUrl(title, date, time, details=''){
  const d = date.replace(/-/g,'');
  let range;
  if(time){
    const [h,mi] = time.split(':').map(Number);
    const end = String(h+1).padStart(2,'0') + String(mi).padStart(2,'0') + '00';
    range = `${d}T${time.replace(':','')}00/${d}T${end}`;
  } else {
    const nx = new Date(new Date(date+'T00:00:00').getTime()+864e5);
    range = `${d}/${isoOf(nx).replace(/-/g,'')}`;
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(title)
    + '&dates=' + range
    + '&details=' + encodeURIComponent(details || 'Agenda Wondergift Social Media Workspace');
}

// versi ringkas untuk sidebar — tanggal hari ini menyala, titik kecil menandai hari yang ada agenda
function sideCalHtml(){
  const [y,m] = calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const lead = (first.getDay()+6)%7;
  const total = new Date(y, m, 0).getDate();
  const prevTotal = new Date(y, m-1, 0).getDate();
  const map = agendaMap();
  const now = today();
  const cells = [];
  for(let i=lead; i>0; i--) cells.push({n:prevTotal-i+1, out:true});
  for(let d=1; d<=total; d++) cells.push({n:d, iso:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length % 7) cells.push({n:'', out:true});

  const grid = DOW.map(d=>`<div class="sc-dow">${d[0]}</div>`).join('')
    + cells.map((c,i)=>{
        const cls = ['sc-d'];
        if(c.out) cls.push('out');
        if(!c.out && (i%7)===6) cls.push('sun');
        if(c.iso === now) cls.push('on');
        if(c.iso && map[c.iso]) cls.push('has');
        return `<div class="${cls.join(' ')}">${c.n}</div>`;
      }).join('');

  const t = new Date(now+'T00:00:00');
  return `<div class="sc-head">
      <span class="sc-month">${first.toLocaleDateString('id-ID',{month:'long'})}</span>
      <span class="sc-year">${y}</span>
    </div>
    <div class="sc-grid">${grid}</div>
    <div class="sc-foot">${ic('cal')}<span>Hari ini <b>${t.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})}</b></span></div>`;
}

let hF = {from:'', to:'', scope:'', status:'', by:'', q:''};
function filteredLog(){
  return S.log.filter(l=>{
    if(hF.from && l.ts.slice(0,10) < hF.from) return false;
    if(hF.to   && l.ts.slice(0,10) > hF.to)   return false;
    if(hF.scope  && l.module !== hF.scope)    return false;
    if(hF.status && l.status !== hF.status)   return false;
    if(hF.by     && l.by !== hF.by)           return false;
    if(hF.q){
      const hay = (l.text+' '+l.module+' '+l.by+' '+l.detail+' '+l.id).toLowerCase();
      if(!hay.includes(hF.q.toLowerCase())) return false;
    }
    return true;
  });
}

function render(withLoader=false){
  const view = document.getElementById('view');
  const ae = document.activeElement;
  const keepSel = focusSelector(ae);
  const caret = ae && ae.selectionStart != null ? ae.selectionStart : null;
  const sameRoute = renderedRoute === route;
  const y = window.scrollY;
  document.getElementById('topTitle').textContent = PAGES.find(p=>p.id===route).name;
  renderNav();
  const paint = () => {
    view.innerHTML = RENDER[route]();
    renderedRoute = route;
    if(sameRoute){ window.scrollTo({top:y}); restoreFocus(keepSel, caret); }
    else window.scrollTo({top:0});
    if(route==='story') fillStoryDates();
    if(route==='brief') renderBriefLists();
    if(route==='reporting') renderPoints();
    if(route!=='dashboard') syncWorkflowVisibility();
  };
  if(withLoader){
    view.innerHTML = `<div class="card skeleton"><div class="sk w1"></div><div class="sk w2"></div><div class="sk w3"></div><div class="sk w2"></div></div>`;
    setTimeout(paint, 220);
  } else paint();
}

let wfHidden = false;
let renderedRoute = null;

// simpan posisi kursor & scroll supaya re-render tidak melempar halaman ke atas
function focusSelector(el){
  if(!el || !el.dataset) return null;
  const d = el.dataset;
  if(d.group && d.key) return `input[data-group="${d.group}"][data-key="${d.key}"]`;
  if(d.action === 'hfilter' && d.key) return `[data-action="hfilter"][data-key="${d.key}"]`;
  return el.id ? '#' + el.id : null;
}
function restoreFocus(sel, caret){
  if(!sel) return;
  const el = document.querySelector(sel);
  if(!el) return;
  el.focus({preventScroll:true});
  if(caret != null && el.setSelectionRange && ['text','search','url','textarea'].includes(el.type || 'textarea')){
    try{ el.setSelectionRange(caret, caret); }catch(e){}
  }
}
function syncWorkflowVisibility(){
  const w = document.getElementById('wfWrap');
  if(!w) return;
  w.classList.toggle('is-hidden', wfHidden);
  const b = document.querySelector('[data-action="toggle-wf"]');
  if(b) b.textContent = wfHidden ? 'Show Workflow' : 'Hide Workflow';
}
